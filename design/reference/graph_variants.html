<!doctype html>
<!-- 선택됨: 노드 모양 E, 배치 2, 열 규칙 '다음 열로' (2026-11-14) -->
<!--
  그래프 노드 모양 비교 시안 (run 20261114-graph-ui). 확정 아님 — 사용자가 고르기 위한 비교용.
  고정: 4명암만, 가로 흐름, 직각 네모 점선 간선, 노드 168x60, 상태는 기호로, 픽셀 글꼴은 이름·상태 문구만.
  스크립트 없음, 외부 요청 없음. 데이터는 예시. 패널 크기는 실제 앱 그래프 패널(약 741x486)에 맞춤.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit 그래프 노드 후보 비교</title>
<style>
@font-face {
  font-family: "Galmuri11";
  src: url("../../src/assets/fonts/Galmuri11.woff2") format("woff2");
  font-display: swap;
}
:root {
  --c-paper: #f8f8ec; --c-light: #b4b8a4; --c-dark: #5c6052; --c-ink: #1c1e18;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px;
  --f-pixel: "Galmuri11", monospace;
  --f-body: "Segoe UI", system-ui, sans-serif;
  --fs-meta: 11px; --fs-pixel: 12px; --fs-body: 13px;
  --b-panel: 3px solid var(--c-ink);
  --sh-panel: inset 0 0 0 2px var(--c-paper), inset 0 0 0 4px var(--c-ink);
  --b-box: 2px solid var(--c-ink);
  --b-box-fail: 2px dashed var(--c-ink);
  --m-blink: 1s; --m-flow: 0.8s; --m-bar: 1.2s;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; background: var(--c-light); color: var(--c-ink); font: var(--fs-body)/1.5 var(--f-body); }
h1 { margin: 0 0 4px; font: 20px var(--f-pixel); }
.lede { margin: 0 0 16px; max-width: 1500px; }
.px { font-family: var(--f-pixel); font-size: var(--fs-pixel); }
:focus-visible { outline: 2px solid var(--c-ink); outline-offset: 2px; }

.grid { display: flex; flex-wrap: wrap; gap: 24px 16px; }
figure { margin: 0; width: 741px; }
figcaption { margin: 0 0 6px; min-height: 40px; }
figcaption b { font-family: var(--f-pixel); font-weight: normal; font-size: 14px; }

/* 그래프 패널: 앱과 같은 이중 테두리, 741x486 */
.panel {
  width: 741px; height: 486px;
  background: var(--c-paper);
  border: var(--b-panel); border-radius: 6px; box-shadow: var(--sh-panel);
  padding: var(--s-3) var(--s-4);
  overflow: hidden;
}
.panel > h2 { margin: 0 0 var(--s-2); font-weight: normal; }

/* 공통 그래프 (현재 Graph.css와 같은 값) */
.canvas { position: relative; width: 432px; height: 410px; margin: 0 0 0 var(--s-2); --gap: 10px; }
.edges { position: absolute; inset: 0; overflow: visible; }
.edge { fill: none; stroke: var(--c-ink); stroke-width: 2; stroke-dasharray: 4 4; }
.edge.flow { animation: flow var(--m-flow) linear infinite; }
@keyframes flow { from { stroke-dashoffset: 8; } to { stroke-dashoffset: 0; } }
.nodes { list-style: none; margin: 0; padding: 0; }
.nodes li { position: absolute; width: 168px; height: 60px; left: 248px; top: calc(var(--i) * (60px + var(--gap))); }
.nodes li.lead { left: 0; top: calc((6 * 60px + 5 * var(--gap)) / 2 - 30px); }
.node {
  width: 100%; height: 100%;
  display: grid; grid-template-columns: 1fr auto; grid-template-rows: 16px 16px 16px; align-items: center;
  padding: var(--s-1) var(--s-2);
  text-align: left; color: var(--c-ink); background: var(--c-paper);
  border: var(--b-box); border-radius: 0;
  font: inherit; cursor: pointer;
}
.node .n-name { grid-column: 1; grid-row: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node .n-name::before { content: "▶ "; visibility: hidden; }
.node[aria-current="true"] .n-name::before { visibility: visible; }
.node .n-state { grid-column: 1; grid-row: 2; }
.node .sym { grid-column: 2; grid-row: 1 / 3; font-family: var(--f-pixel); font-size: var(--fs-pixel); min-width: 20px; text-align: right; }
.node .n-meta { grid-column: 1 / 3; grid-row: 3; font-size: var(--fs-meta); color: var(--c-dark); white-space: nowrap; overflow: hidden; }
.pbar { grid-column: 1 / 3; grid-row: 3; position: relative; height: 8px; border: 1px solid currentColor; overflow: hidden; }
.pbar i { position: absolute; top: 0; bottom: 0; left: 0; width: 35%; background: currentColor; animation: bar var(--m-bar) steps(6) infinite; }
@keyframes bar { from { left: -35%; } to { left: 100%; } }
.blink { animation: blink var(--m-blink) step-end infinite; }
@keyframes blink { 50% { visibility: hidden; } }
.node.is-fail { border: var(--b-box-fail); }
.node.is-wait { background: var(--c-light); }
.node.is-wait .n-meta { color: var(--c-ink); }

/* A. 현재 구현: 각진 모서리, 실행 중 = 통째 반전 */
.vA .node.is-run, .vB .node.is-run { background: var(--c-ink); color: var(--c-paper); }

/* B. 모서리만 둥글게 */
.vB .node { border-radius: 4px; }
.vB .pbar { border-radius: 2px; }

/* C. 둥근 모서리 + 실행 중 = 밝은 바탕 + 3px 테두리 + 진행 막대 */
.vC .node { border-radius: 4px; }
.vC .pbar { border-radius: 2px; }
.vC .node.is-run { border-width: 3px; padding: 3px 7px; }

/* D. 둥근 모서리 + 실행 중 = 이름 줄만 검은 띠 */
.vD .node { border-radius: 4px; }
.vD .pbar { border-radius: 2px; }
.vD .node.is-run { background: linear-gradient(var(--c-ink) 0 21px, var(--c-paper) 21px); }
.vD .node.is-run .n-name { color: var(--c-paper); }

/* E. RPG 대화창: 얇은 이중 테두리, 6px 둥글림, 간격 넓힘, 실행 중 = 패널과 같은 굵은 이중 테두리 */
.vE .canvas { --gap: 12px; width: 448px; height: 420px; }
.vE .nodes li { left: 264px; }
.vE .nodes li.lead { left: 0; }
.vE .node {
  border-radius: 6px;
  box-shadow: inset 0 0 0 2px var(--c-paper), inset 0 0 0 3px var(--c-ink);
  padding: var(--s-1) 10px;
}
.vE .node.is-fail { box-shadow: none; }
.vE .node.is-wait { box-shadow: inset 0 0 0 2px var(--c-light), inset 0 0 0 3px var(--c-ink); }
.vE .node.is-run { border-width: 3px; padding: 3px 9px; box-shadow: var(--sh-panel); }
.vE .pbar { height: 8px; border-radius: 4px; }
.vE .pbar i { border-radius: 2px; }

/* 배치 묶음: 노드 모양은 E. li는 inline left/top으로 놓는다 */
h1.second { margin-top: 40px; }
.lay .canvas { margin: 0; }
.lay .nodes li { left: auto; }
.hscroll { overflow-x: auto; overflow-y: hidden; margin-left: var(--s-2); padding: 2px 0 var(--s-2); scrollbar-color: var(--c-ink) var(--c-light); }
/* 정적 시안에서 "최신 열로 스크롤된" 상태를 흉내 낸다. 앱에서는 실행 중/선택 노드를 scrollIntoView. */
.hscroll.end { direction: rtl; }
.hscroll.end > .canvas { direction: ltr; }

@media (prefers-reduced-motion: reduce) {
  .edge.flow, .pbar i, .blink { animation: none; }
  .pbar i { left: 0; }
}
</style>
</head>
